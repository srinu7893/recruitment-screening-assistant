# Single active instance. Replace, never run a rolling deployment of this worker.
services:
  recruiter:
    build: .
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set your direct Neon PostgreSQL URL}
      SCREENING_PUBLIC_URL: ${SCREENING_PUBLIC_URL:?Set your public HTTPS origin}
      SCREENING_PROVIDER: ${SCREENING_PROVIDER:-demo}
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 90s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=20)"]
      interval: 30s
      timeout: 25s
      start_period: 30s
      retries: 3
