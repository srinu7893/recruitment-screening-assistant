name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m screening examples/assessment.json
      - run: python -m examples.demo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: test-results/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t recruitment-screening:test .
